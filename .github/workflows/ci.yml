name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node.js 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build, test and verify package
        run: npm run check
      - name: Pack release archive
        run: npm run pack:release
      - name: Retain package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: artifacts/*.tgz
          if-no-files-found: error
